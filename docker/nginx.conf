# nginx config for Laravel + Inertia + Vite SSR on Coolify
daemon off;
error_log /dev/stderr info;
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;
        root /app/public;
        index index.php;

        charset utf-8;

        # ── Security headers (always ensures they're sent even on error responses) ──
        add_header Strict-Transport-Security          "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options                    "DENY" always;
        add_header X-Content-Type-Options             "nosniff" always;
        add_header X-XSS-Protection                   "1; mode=block" always;
        add_header Referrer-Policy                    "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy                 "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy         "same-origin" always;
        add_header Content-Security-Policy            "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # Long cache for Vite content-hashed assets.
        # 'add_header' here overrides server-level headers — repeat them.
        location ^~ /build/ {
            access_log off;
            expires 1y;
            add_header Cache-Control          "public, immutable";
            add_header Strict-Transport-Security      "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options                  "DENY" always;
            add_header X-Content-Type-Options           "nosniff" always;
            add_header X-XSS-Protection                 "1; mode=block" always;
            add_header Referrer-Policy                  "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy               "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
            add_header Cross-Origin-Opener-Policy       "same-origin" always;
            add_header Content-Security-Policy          "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
            try_files $uri =404;
        }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php-fpm/www.sock;
            fastcgi_index index.php;

            # Inlined fastcgi_params — the Nixpacks image does not ship
            # a global fastcgi_params file we can `include`.
            fastcgi_param  QUERY_STRING        $query_string;
            fastcgi_param  REQUEST_METHOD      $request_method;
            fastcgi_param  CONTENT_TYPE        $content_type;
            fastcgi_param  CONTENT_LENGTH      $content_length;

            fastcgi_param  SCRIPT_NAME         $fastcgi_script_name;
            fastcgi_param  SCRIPT_FILENAME     $realpath_root$fastcgi_script_name;
            fastcgi_param  REQUEST_URI         $request_uri;
            fastcgi_param  DOCUMENT_URI        $document_uri;
            fastcgi_param  DOCUMENT_ROOT       $realpath_root;
            fastcgi_param  SERVER_PROTOCOL     $server_protocol;
            fastcgi_param  REQUEST_SCHEME      $scheme;
            fastcgi_param  HTTPS               $https if_not_empty;

            fastcgi_param  GATEWAY_INTERFACE   CGI/1.1;
            fastcgi_param  SERVER_SOFTWARE     nginx/$nginx_version;

            fastcgi_param  REMOTE_ADDR         $remote_addr;
            fastcgi_param  REMOTE_PORT         $remote_port;
            fastcgi_param  REMOTE_USER         $remote_user;
            fastcgi_param  SERVER_ADDR         $server_addr;
            fastcgi_param  SERVER_PORT         $server_port;
            fastcgi_param  SERVER_NAME         $server_name;

            # Trust the scheme forwarded by Coolify's reverse proxy so
            # Laravel generates https:// URLs when the user is on HTTPS.
            fastcgi_param  HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
            fastcgi_param  HTTP_X_FORWARDED_FOR   $http_x_forwarded_for;

            # Raise PHP upload limits above the Nixpacks/PHP defaults
            # (2M / 8M) so the media uploader can handle real photos.
            # These must stay <= the nginx `client_max_body_size` above.
            fastcgi_param  PHP_VALUE "upload_max_filesize=50M
            post_max_size=50M
            memory_limit=256M
            max_execution_time=120
            max_input_time=120";

            fastcgi_read_timeout 120s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Block access to dotfiles (except .well-known for ACME etc.).
        location ~ /\.(?!well-known).* {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
